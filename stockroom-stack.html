<script>
/* Theme bootstrap: follows the Toolbox palette + appearance (same localStorage keys), and stays in sync via the storage event */
(function () {
  function apply() {
    var p = 'autumn', t = 'light';
    try { p = localStorage.getItem('stockroom_palette') === 'default' ? 'default' : 'autumn'; t = localStorage.getItem('stockroom_theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
    var d = document.documentElement; d.setAttribute('data-palette', p); d.setAttribute('data-theme', t);
    if (/[?&]embed\b/.test(location.search)) d.classList.add('embed');
  }
  apply();
  window.addEventListener('storage', function (e) { if (e.key === 'stockroom_palette' || e.key === 'stockroom_theme') { apply(); if (window.__onTheme) window.__onTheme(); } });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{ --font:'Press Start 2P','Courier New',monospace; --red:#FF5A4D; }
  /* ---- Palette: Default (Pitt blue + green). The "screen" colours stay dark in light appearance, like a CRT. ---- */
  html[data-palette="default"]{
    --s-bg:var(--s-bg); --s-panel:#0B1736; --s-line:#1B2D5E; --s-text:#DCE6FA; --s-muted:#7F92B8; --s-overlay:var(--s-overlay);
    --s-accent:#00AD6E; --s-accent-hover:var(--accent-hover); --s-on-accent:var(--on-accent); --s-edge:#003594;
    --floor-a:#0A1740; --floor-b:var(--s-bg); --floor-grid:rgba(0,173,110,.07); --hl:rgba(0,173,110,.18); --flash:rgba(0,173,110,.7); --card-hover:var(--card-hover);
  }
  html[data-palette="default"][data-theme="dark"]{ --bg:#0a1628; --panel:#10213b; --line:#223657; --text:#e6ecf5; --muted:#93a3bd; --shadow:var(--shadow); --focus:#fff;
    --accent:#00AD6E; --accent-hover:var(--accent-hover); --on-accent:var(--on-accent); --edge:#003594; }
  html[data-palette="default"][data-theme="light"]{ --bg:#f4f5f7; --panel:#ffffff; --line:#c9cfdb; --text:#1a1d23; --muted:#5a6072; --shadow:rgba(0,32,91,.28); --focus:#1a1d23;
    --accent:#007a4d; --accent-hover:#006640; --on-accent:#ffffff; --edge:#003594; }
  /* ---- Palette: Autumn (umber, rust, gold) ---- */
  html[data-palette="autumn"]{
    --s-bg:#1a0e07; --s-panel:#241409; --s-line:#50361f; --s-text:#fbefdc; --s-muted:#cdb393; --s-overlay:rgba(18,9,4,.94);
    --s-accent:#FFB81C; --s-accent-hover:#ffd24d; --s-on-accent:#1d0e06; --s-edge:#9c3a0b;
    --floor-a:#2a160a; --floor-b:#241208; --floor-grid:rgba(255,184,28,.09); --hl:rgba(255,184,28,.22); --flash:rgba(255,184,28,.78); --card-hover:#b4501a;
  }
  html[data-palette="autumn"][data-theme="dark"]{ --bg:#150b06; --panel:#241409; --line:#50361f; --text:#fbefdc; --muted:#d0b697; --shadow:#0b0503; --focus:#fff;
    --accent:#FFB81C; --accent-hover:#ffd24d; --on-accent:#1d0e06; --edge:#9c3a0b; }
  html[data-palette="autumn"][data-theme="light"]{ --bg:#f5ede0; --panel:#fffaf1; --line:#d8c4a4; --text:#22140b; --muted:#5e4838; --shadow:rgba(59,29,12,.3); --focus:#22140b;
    --accent:#9c3a0b; --accent-hover:#7a2a08; --on-accent:#ffffff; --edge:#FFB81C; }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{min-height:100vh;display:flex;justify-content:center;padding:14px 12px 24px}
  #app{width:min(100%,488px)}

  header{margin-bottom:14px;display:flex;align-items:center;gap:14px}
  #pudgie{width:72px;height:72px;flex:none;image-rendering:pixelated;background:var(--s-bg);border:3px solid var(--line)}
  #pudgie.hop{animation:hop .4s steps(3) 1}
  @keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-8px)}70%{transform:translateY(-3px)}100%{transform:translateY(0)}}
  h1{margin:0;font-size:clamp(13px,3.8vw,18px);line-height:1.35;color:var(--accent);
     text-shadow:3px 3px 0 var(--edge);letter-spacing:0;font-weight:400}
  header p{margin:8px 0 0;font-size:7px;color:var(--muted);line-height:1.8}

  #hud{display:flex;align-items:stretch;gap:10px;margin-bottom:12px}
  .box{background:var(--panel);border:3px solid var(--line);padding:8px 10px}
  #dest{flex:2.2;min-width:0;min-height:76px}
  #dest .name{font-size:9px;line-height:1.5;color:var(--text);margin-bottom:6px;overflow-wrap:anywhere}
  #dest .addr{font-size:6px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}
  #dest.flash{animation:flash .5s steps(2) 1}
  @keyframes flash{0%{border-color:var(--accent)}100%{border-color:var(--line)}}
  .lbl{font-size:7px;color:var(--muted);margin-bottom:6px}
  .val{font-size:12px;color:var(--text)}
  .stat{flex:1;min-width:0}
  #snd{font-family:var(--font);font-size:7px;color:var(--text);background:var(--panel);
    border:3px solid var(--line);cursor:pointer;padding:0 8px}
  #snd:hover{border-color:var(--accent)}

  #play{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  #boardwrap{flex:none;max-width:100%}
  #stage{position:relative;border:4px solid var(--edge);border-bottom:0;box-shadow:6px 0 0 var(--shadow);background:var(--s-bg)}
  #stage.shake{animation:shake .3s steps(2) 1}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}
    50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}100%{transform:translate(0,0)}}
  canvas#board{display:block;width:280px;max-width:100%;height:auto;aspect-ratio:1/2;image-rendering:pixelated}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
  #pallet{height:18px;border:4px solid var(--edge);border-top:0;box-shadow:6px 6px 0 var(--shadow);
    background:repeating-linear-gradient(90deg,#9A7440 0 30px,#4F3A1C 30px 34px);position:relative}
  #pallet::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#B58B4E}

  #overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;padding:16px;text-align:center;background:var(--s-overlay)}
  #overlay.hidden{display:none}
  #overlay h2{margin:0;font-size:13px;font-weight:400;line-height:1.5;color:var(--text)}
  #overlay h2.bad{color:var(--red);font-size:17px;text-shadow:3px 3px 0 #4a1410}
  #overlay p{margin:0;font-size:8px;line-height:1.9;color:var(--muted)}
  #overlay p b{color:var(--text);font-weight:400}
  .btn{font-family:var(--font);font-size:10px;color:var(--on-accent);background:var(--accent);cursor:pointer;
    border:0;padding:12px 16px;box-shadow:4px 4px 0 var(--edge)}
  .btn:hover{background:var(--accent-hover)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  #side{display:flex;flex-direction:column;gap:10px;width:136px}
  #side .box{padding:8px}
  #side canvas{background:var(--s-bg)}
  #side canvas{display:block;margin:0 auto;image-rendering:pixelated}
  .two{display:flex;gap:8px}
  .two > div{flex:1}

  #toast{height:20px;margin-top:16px;font-size:9px;color:var(--accent);text-align:center;opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}
  #manifest{margin-top:6px;min-height:78px}
  #manifest div.row{font-size:7px;line-height:1.9;color:var(--text);overflow-wrap:anywhere}
  #manifest div.row span{color:var(--accent)}
  #manifest div.row.old{color:var(--muted)}
  #manifest .empty{font-size:7px;color:var(--muted);line-height:1.9}

  #pad{display:none;margin:12px auto 0;width:min(100%,300px);grid-template-columns:repeat(3,1fr);gap:8px}
  #pad button{font-family:var(--font);font-size:9px;color:var(--text);background:var(--panel);
    border:3px solid var(--line);cursor:pointer;padding:16px 4px}
  #pad button:active{background:var(--edge);border-color:var(--accent)}
  @media (pointer:coarse){#pad{display:grid}}

  .keys{margin-top:14px;font-size:7px;color:var(--muted);line-height:2.1;text-align:center}
  @media (prefers-reduced-motion:reduce){#stage.shake,#dest.flash,#pudgie.hop{animation:none}}

  /* Anything on the game screen (playfield + its overlays) keeps the dark "screen" colours in every theme */
  #stage{ --text:var(--s-text); --muted:var(--s-muted); --panel:var(--s-panel); --line:var(--s-line);
          --accent:var(--s-accent); --accent-hover:var(--s-accent-hover); --on-accent:var(--s-on-accent); --edge:var(--s-edge); --focus:#fff; }
  html{ background:var(--bg); }
  html.embed body{ min-height:0; padding-top:8px; padding-bottom:16px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <canvas id="pudgie" width="24" height="24" aria-label="Pudgie"></canvas>
    <div>
      <h1>HELP PUDGIE LOAD THE TRUCK</h1>
      <p>Pudgie drives the deliveries. Fill a row edge to edge and it goes on the truck.</p>
    </div>
  </header>

  <div id="hud">
    <div id="dest" class="box">
      <div class="lbl">DELIVER TO</div>
      <div class="name" id="destName">-</div>
      <div class="addr" id="destAddr"></div>
    </div>
    <div class="stat box"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
    <div class="stat box"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
    <button id="snd" aria-label="Toggle sound">SND<br>ON</button>
  </div>

  <div id="play">
    <div id="boardwrap">
      <div id="stage">
        <canvas id="board" width="280" height="560"></canvas>
        <div id="overlay"></div>
      </div>
      <div id="pallet"></div>
    </div>
    <aside id="side">
      <div class="box"><div class="lbl">HOLD</div><canvas id="hold" width="84" height="52"></canvas></div>
      <div class="box"><div class="lbl">NEXT</div><canvas id="next" width="84" height="156"></canvas></div>
      <div class="box two">
        <div><div class="lbl">ROWS</div><div class="val" id="lines">0</div></div>
        <div><div class="lbl">SHIFT</div><div class="val" id="level">1</div></div>
      </div>
    </aside>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="manifest" class="box"><div class="lbl">ON THE TRUCK</div><div id="log"></div></div>

  <div id="pad">
    <button data-a="left" aria-label="Move left">&#9664;</button>
    <button data-a="down" aria-label="Soft drop">&#9660;</button>
    <button data-a="right" aria-label="Move right">&#9654;</button>
    <button data-a="rotate">ROTATE</button>
    <button data-a="drop">DROP</button>
    <button data-a="hold">HOLD</button>
  </div>

  <div class="keys">Left and Right move, Up or X rotates, Z rotates back<br>Down speeds up, Space drops, C holds, P pauses, M mutes</div>
</div>

/* ============ PUDGIE (24x24 pixel sprite) ============ */
function pudgieSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 24;
  const g = c.getContext('2d');
  const R = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const SK = '#E9AE88', SKs = '#CC8F69', WH = '#F7F7F2', INK = '#15151A', MOUTH = '#8A3B32';
  const HW = '#F2F2F2', HWd = '#C9CBD0';
  const GR = '#8D939B', GRd = '#6B7078', GRl = '#A6ACB3';
  // white buzz cut (flecked so it reads as short bristles)
  R(HW, 8, 3, 8, 1); R(HW, 6, 4, 12, 3);
  for (let y = 3; y <= 6; y++) for (let x = 6; x <= 17; x++) if ((x * 3 + y * 5) % 4 === 0 && !(y === 3 && (x < 8 || x > 15))) R(HWd, x, y);
  R(HW, 6, 7, 1, 2); R(HW, 17, 7, 1, 2);
  // face: weathered, no glasses
  R(SK, 6, 7, 12, 9); R(SK, 7, 16, 10, 1); R(SK, 8, 17, 8, 1);
  R(SK, 5, 9, 1, 3); R(SK, 18, 9, 1, 3);
  R(HW, 6, 7, 1, 2); R(HW, 17, 7, 1, 2);
  R(SKs, 8, 7, 8, 1);                                  // forehead wrinkle
  R(HW, 7, 8, 3, 1); R(HW, 14, 8, 3, 1);               // bushy white brows
  R(WH, 7, 9, 3, 2); R(INK, 8, 9, 1, 2); R(WH, 14, 9, 3, 2); R(INK, 15, 9, 1, 2);
  R(SKs, 6, 10, 1, 1); R(SKs, 17, 10, 1, 1);           // crow's feet
  R(SKs, 11, 10, 2, 4);                                // nose
  R(SKs, 8, 13, 1, 2); R(SKs, 15, 13, 1, 2);           // cheek lines
  // short white stubble
  for (let y = 12; y <= 17; y++) for (let x = 7; x <= 16; x++){
    if (y === 12 && (x < 7 || x > 8) && (x < 15)) continue;
    if (y >= 16 && (x < 8 || x > 15)) continue;
    if (((x * 7 + y * 13) % 3) === 0) R('#F4F4F4', x, y);
  }
  R(MOUTH, 10, 15, 4, 1);
  R(SKs, 10, 18, 4, 1);
  // grey t-shirt
  R(GR, 6, 19, 4, 1); R(GR, 14, 19, 4, 1); R(GR, 4, 20, 16, 3);
  R(GRd, 4, 20, 2, 3); R(GRd, 18, 20, 2, 3);
  R(GRd, 9, 19, 6, 1); R(GRl, 10, 20, 4, 1);
  // dark outline for contrast
  const a = g.getImageData(0, 0, 24, 24).data, pts = [];
  const op = (x, y) => x >= 0 && y >= 0 && x < 24 && y < 24 && a[(y * 24 + x) * 4 + 3] > 0;
  for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++)
    if (!op(x, y) && (op(x-1, y) || op(x+1, y) || op(x, y-1) || op(x, y+1))) pts.push([x, y]);
  g.fillStyle = '#050B1E'; pts.forEach(([x, y]) => g.fillRect(x, y, 1, 1));
  return c;
}

const tileCache = {};
// a plain cardboard box seen from above: outline, bevel, one strip of tape
function getTile(i, s){
  const key = i + ':' + s;
  if (tileCache[key]) return tileCache[key];
  const b = PIECES[i].box;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const f = s / 28, S = v => Math.max(1, Math.round(v * f));
  const R = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const e = S(1), inner = s - 2 * e;
  R(b.edge, 0, 0, s, s);
  R(b.base, e, e, inner, inner);
  R(b.hi, e, e, inner, e); R(b.hi, e, e, e, inner);
  R(b.lo, e, s - 2 * e, inner, e); R(b.lo, s - 2 * e, e, e, inner);
  const tw = S(8), tx = Math.round((s - tw) / 2);
  R(b.tape, tx, e, tw, inner);
  R('rgba(0,0,0,0.16)', tx, e, 1, inner); R('rgba(0,0,0,0.16)', tx + tw - 1, e, 1, inner);
  R('rgba(255,255,255,0.3)', tx + 1, e, 1, inner);
  return tileCache[key] = c;
}

let audio = null, soundOn = true;
function tone(freq, dur, delay = 0, type = 'square', vol = 0.05){
  if (!soundOn) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}

/* ============ RULES (Tetris Guideline) ============
   - 7-bag randomizer, hold, ghost piece, 3-piece preview
   - Super Rotation System with wall kicks
   - Gravity: (0.8 - (level-1) * 0.007)^(level-1) seconds per row
   - 10 rows per level, soft drop 20x gravity
   - Lock delay 0.5 s, resets on move/rotate, up to 15 times
   - Scoring: 100/300/500/800 x level, back-to-back x1.5, combos, perfect clear
   - Auto-repeat: 150 ms delay, then 40 ms per step                       */
const LOCK_MS = 500, MAX_RESETS = 15, CLEAR_MS = 260, DAS = 150, ARR = 40;
let mode = 'select';              // select | play | pause | clearing | over
let best = 0;
let board = [], cur = null, hold = null, canHold = true;
let bag = [], queue = [];
let score = 0, lines = 0, level = 1, combo = -1, b2b = false;
let dropT = 0, lockT = 0, resets = 0, lowest = 0, soft = false;
let clearRows = [], clearT = 0, lastTs = 0;
let held = { left:false, right:false }, dir = 0, dasT = 0, arrT = 0;
let logLines = [];

const newBoard = () => Array.from({length: ROWS}, () => Array(COLS).fill(null));
// guideline speed curve, in milliseconds per row
const gravity = () => Math.max(0.5, 1000 * Math.pow(0.8 - (level - 1) * 0.007, level - 1));

function newItem(t){ return { t, d: Math.floor(Math.random() * DESTS.length) }; }
function refill(){
  const b = [0,1,2,3,4,5,6];
  for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  bag.push(...b);
}
function fillQueue(){ while (queue.length < 5){ if (!bag.length) refill(); queue.push(newItem(bag.pop())); } }
function take(){ fillQueue(); const it = queue.shift(); fillQueue(); return it; }

function collide(m, x, y){
  for (let cy = 0; cy < m.length; cy++) for (let cx = 0; cx < m.length; cx++){
    if (!m[cy][cx]) continue;
    const bx = x + cx, by = y + cy;
    if (bx < 0 || bx >= COLS || by >= ROWS) return true;
    if (by >= 0 && board[by][bx]) return true;
  }
  return false;
}
const grounded = () => collide(cur.m, cur.x, cur.y + 1);

function showDest(d){
  const [name, area, addr] = DESTS[d];
  el('destName').textContent = name;
  el('destAddr').textContent = [addr, area ? area + ', PA' : ''].filter(Boolean).join(' - ');
  const box = el('dest'); box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
}

function spawn(item){
  const m = PIECES[item.t].m.map(r => r.slice());
  cur = { t: item.t, d: item.d, m, r: 0, x: Math.floor((COLS - m.length) / 2), y: item.t === 0 ? -1 : 0 };
  dropT = 0; lockT = 0; resets = 0; lowest = cur.y;
  showDest(cur.d);
  if (collide(cur.m, cur.x, cur.y)) gameOver();
}
function spawnNext(){ spawn(take()); canHold = true; }

function rotMatrix(m, dirn){
  const n = m.length, r = m.map(row => row.map(() => 0));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    r[y][x] = dirn > 0 ? m[n - 1 - x][y] : m[x][n - 1 - y];
  return r;
}

  '12':[[0,0],[1,0],[1,-1],[0,2],[1,2]],     '21':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '23':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],    '32':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  '30':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],  '03':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]
};
const KICK_I = {
  '01':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],   '10':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
  '12':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],   '21':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '23':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],   '32':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '30':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],   '03':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
};
function rotate(dirn){
  if (cur.t === 1) return;
  const nm = rotMatrix(cur.m, dirn), nr = (cur.r + (dirn > 0 ? 1 : 3)) % 4;
  const table = cur.t === 0 ? KICK_I : KICK_JLSTZ;
  for (const [dx, dy] of table['' + cur.r + nr]){
    if (!collide(nm, cur.x + dx, cur.y - dy)){
      cur.m = nm; cur.r = nr; cur.x += dx; cur.y -= dy; touched(); sfx.rotate(); return;
    }
  }
}
function move(dx){
  if (!collide(cur.m, cur.x + dx, cur.y)){ cur.x += dx; touched(); sfx.move(); return true; }
  return false;
}
// "move reset" lock delay: moving or rotating a grounded piece restarts the timer (max 15 times)
function touched(){ if (grounded() && resets < MAX_RESETS){ lockT = 0; resets++; } }

function ghostY(){ let y = cur.y; while (!collide(cur.m, cur.x, y + 1)) y++; return y; }

function hardDrop(){
  let n = 0;
  while (!collide(cur.m, cur.x, cur.y + 1)){ cur.y++; n++; }
  score += 2 * n; updateHud();
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  lockPiece();
}
function holdPiece(){
  if (!canHold) return;
  const item = { t: cur.t, d: cur.d };
  if (!hold){ hold = item; spawn(take()); } else { const h = hold; hold = item; spawn(h); }
  canHold = false; sfx.hold();
}

function lockPiece(){
  for (let cy = 0; cy < cur.m.length; cy++) for (let cx = 0; cx < cur.m.length; cx++){
    if (!cur.m[cy][cx]) continue;
    const bx = cur.x + cx, by = cur.y + cy;
    if (by < 0) return gameOver();
    board[by][bx] = { t: cur.t, d: cur.d };
  }
  sfx.lock();
  const full = [];
  for (let y = 0; y < ROWS; y++) if (board[y].every(c => c)) full.push(y);
  cur = null;
  if (full.length){
    mode = 'clearing'; clearRows = full; clearT = CLEAR_MS; sfx.clear(full.length);
  } else {
    combo = -1;
    spawnNext();
  }
}

function pushLog(msg){
  logLines.unshift(msg); logLines = logLines.slice(0, 4); renderLog();
}
function renderLog(){
  el('log').innerHTML = logLines.length
    ? logLines.map((m, i) => `<div class="row ${i ? 'old' : ''}"><span>LOADED</span> ${m}</div>`).join('')
    : '<div class="empty">Nothing loaded yet. Fill a row to put it on the truck.</div>';
}

function finishClear(){
  const n = clearRows.length;
  // which destinations just shipped
  const dests = [];
  clearRows.forEach(y => board[y].forEach(c => { if (c && !dests.includes(c.d)) dests.push(c.d); }));
  board = board.filter((_, i) => !clearRows.includes(i));
  while (board.length < ROWS) board.unshift(Array(COLS).fill(null));

  let pts = [0, 100, 300, 500, 800][n] * level;
  let tag = ['', 'Row loaded', 'Two rows loaded', 'Three rows loaded', 'Four rows! Full load!'][n];
  if (n === 4){ if (b2b){ pts = Math.floor(pts * 1.5); tag = 'Back-to-back full load!'; } b2b = true; } else b2b = false;
  combo++;
  if (combo > 0) pts += 50 * combo * level;
  if (board.every(r => r.every(c => !c))){ pts += [0, 800, 1200, 1800, 2000][n] * level; tag = 'Truck bay clear! Perfect load'; }
  score += pts;

  const before = level;
  lines += n; level = 1 + Math.floor(lines / 10);
  if (level > before){ tag = 'Shift ' + level + ' begins. Boxes come faster.'; sfx.level(); }
  else if (combo > 1) tag += '  x' + combo + ' combo';
  showToast(tag);

  dests.slice(0, 3).forEach(d => pushLog(DESTS[d][0] + (DESTS[d][1] ? ', ' + DESTS[d][1] : '')));
  if (dests.length > 3) pushLog('+' + (dests.length - 3) + ' more destinations');
  if (score > best) best = score;
  updateHud();
  clearRows = []; mode = 'play';
  pudgieEl.classList.remove('hop'); void pudgieEl.offsetWidth; pudgieEl.classList.add('hop');
  spawnNext();
}

function gameOver(){
  if (mode === 'over') return;
  mode = 'over'; cur = null; sfx.die(); dir = 0;
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  if (score > best) best = score;
  updateHud();
  const msgs = ['Pudgie can\'t fit another box.', 'The loading bay is jammed.', 'Pudgie is going to be late.',
    'Time to rearrange the load.', 'The truck is already packed to the roof.'];
  setTimeout(() => {
    overlay.innerHTML = `
      <h2 class="bad">OVERLOADED</h2>
      <p>${msgs[Math.floor(Math.random() * msgs.length)]}</p>
      <p>Rows loaded: <b>${lines}</b><br>Reached shift: <b>${level}</b><br>Score: <b>${score}</b><br>Best: <b>${best}</b></p>
      <button class="btn" id="again">TRY AGAIN</button>`;
    overlay.classList.remove('hidden');
    el('again').onclick = startGame; el('again').focus();
  }, 650);
}

let toastTimer;
function showToast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1500);
}
function updateHud(){
  el('score').textContent = score; el('best').textContent = best;
  el('lines').textContent = lines; el('level').textContent = level;
}

function startGame(){
  board = newBoard(); bag = []; queue = []; hold = null; canHold = true;
  score = 0; lines = 0; level = 1; combo = -1; b2b = false; soft = false; clearRows = [];
  held = { left:false, right:false }; dir = 0; logLines = []; renderLog();
  updateHud();
  mode = 'play';
  overlay.classList.add('hidden');
  spawnNext();
  sfx.start();
}

/* ============ UPDATE ============ */
function update(dt){
  if (mode === 'clearing'){ clearT -= dt; if (clearT <= 0) finishClear(); return; }
  if (mode !== 'play' || !cur) return;

  // sideways auto-repeat
  if (dir){
    dasT += dt;
    if (dasT >= DAS){
      arrT += dt;
      while (arrT >= ARR){ arrT -= ARR; if (!move(dir)) { arrT = 0; break; } }
    }
  }

  const g = gravity(), iv = soft ? Math.max(0.5, Math.min(g, g / 20)) : g;
  if (grounded()){
    lockT += dt;
    if (lockT >= LOCK_MS) lockPiece();
  } else {
    dropT += dt;
    let guard = 40;
    while (dropT >= iv && !grounded() && guard--){
      cur.y++; dropT -= iv; if (soft) score += 1;
      if (cur.y > lowest){ lowest = cur.y; resets = 0; lockT = 0; }   // new lowest row refreshes the reset counter
    }
    if (grounded()) dropT = 0;
    if (soft) updateHud();
  }
}

/* ============ DRAW ============ */
function drawMini(g, t, cx, cy, s, alpha = 1){
  const m = PIECES[t].m; let x0 = 9, x1 = -1, y0 = 9, y1 = -1;
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m.length; x++) if (m[y][x]){
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  const ox = Math.round(cx - (x1 - x0 + 1) * s / 2), oy = Math.round(cy - (y1 - y0 + 1) * s / 2);
  g.globalAlpha = alpha;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (m[y][x])
    g.drawImage(getTile(t, s), ox + (x - x0) * s, oy + (y - y0) * s);
  g.globalAlpha = 1;
}
function draw(){
  ctx.drawImage(floor, 0, 0);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const c = board[y] && board[y][x];
    if (c) ctx.drawImage(getTile(c.t, CELL), x * CELL, y * CELL);
  }
  if (mode === 'clearing'){
    ctx.fillStyle = (Math.floor((CLEAR_MS - clearT) / 65) % 2) ? 'rgba(255,255,255,.85)' : TH.flash;
    clearRows.forEach(y => ctx.fillRect(0, y * CELL, COLS * CELL, CELL));
  }
  if (cur){
    const col = PIECES[cur.t].box.base, gy = ghostY();
    for (let cy = 0; cy < cur.m.length; cy++) for (let cx = 0; cx < cur.m.length; cx++){
      if (!cur.m[cy][cx] || gy + cy < 0) continue;
      const gx = (cur.x + cx) * CELL, gyy = (gy + cy) * CELL;
      ctx.fillStyle = col; ctx.globalAlpha = 0.12; ctx.fillRect(gx, gyy, CELL, CELL);
      ctx.globalAlpha = 0.55; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.strokeRect(gx + 1, gyy + 1, CELL - 2, CELL - 2); ctx.globalAlpha = 1;
    }
    for (let cy = 0; cy < cur.m.length; cy++) for (let cx = 0; cx < cur.m.length; cx++){
      if (!cur.m[cy][cx] || cur.y + cy < 0) continue;
      ctx.drawImage(getTile(cur.t, CELL), (cur.x + cx) * CELL, (cur.y + cy) * CELL);
    }
  }
  holdCtx.clearRect(0, 0, 84, 52); nextCtx.clearRect(0, 0, 84, 156);
  if (hold) drawMini(holdCtx, hold.t, 42, 26, 16, canHold ? 1 : 0.4);
  if (mode !== 'select') for (let i = 0; i < 3; i++) if (queue[i]) drawMini(nextCtx, queue[i].t, 42, 26 + i * 52, 16);
}

/* ============ LOOP ============ */
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(100, ts - lastTs); lastTs = ts;
  update(dt);
  draw();
}
requestAnimationFrame(frame);

/* ============ SCREENS ============ */
function showStart(){
  mode = 'select'; cur = null; hold = null; queue = []; board = newBoard();
  overlay.innerHTML = `
    <h2>HELP PUDGIE<br>LOAD THE TRUCK</h2>
    <p>Every box has a stop on the route.<br>Fill a row to get it on the truck.</p>
    <button class="btn" id="go">START LOADING</button>
    <p>Boxes come faster every 10 rows.</p>`;
  overlay.classList.remove('hidden');
  el('go').onclick = startGame; el('go').focus();
  renderLog();
}
function togglePause(){
  if (mode === 'play'){
    mode = 'pause';
    overlay.innerHTML = `<h2>ON BREAK</h2><p>Press P or tap to resume.</p><button class="btn" id="resume">RESUME</button>`;
    overlay.classList.remove('hidden');
    el('resume').onclick = togglePause;
  } else if (mode === 'pause'){
    mode = 'play'; overlay.classList.add('hidden');
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') togglePause(); });

/* ============ INPUT ============ */
function press(side){
  held[side] = true; dir = side === 'left' ? -1 : 1; dasT = 0; arrT = 0;
  if (mode === 'play' && cur) move(dir);
}
function release(side){
  held[side] = false;
  dir = held.left ? -1 : held.right ? 1 : 0; dasT = 0; arrT = 0;
}
function act(a){
  if (mode !== 'play' || !cur) return;
  if (a === 'rotate') rotate(1);
  else if (a === 'rotateCCW') rotate(-1);
  else if (a === 'drop') hardDrop();
  else if (a === 'hold') holdPiece();
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); try{ parent.postMessage({ type: 'toolbox-quicklaunch' }, location.origin); }catch(x){} return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if (k === 'm' || k === 'M'){ toggleSound(); return; }
  if (mode === 'select' || mode === 'over'){ if (k === 'Enter' || k === ' ') startGame(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape'){ togglePause(); return; }
  if (e.repeat) return;
  if (k === 'ArrowLeft') press('left');
  else if (k === 'ArrowRight') press('right');
  else if (k === 'ArrowDown') soft = true;
  else if (k === 'ArrowUp' || k === 'x' || k === 'X') act('rotate');
  else if (k === 'z' || k === 'Z') act('rotateCCW');
  else if (k === ' ') act('drop');
  else if (k === 'c' || k === 'C' || k === 'Shift') act('hold');
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') release('left');
  else if (e.key === 'ArrowRight') release('right');
  else if (e.key === 'ArrowDown') soft = false;
});

document.querySelectorAll('#pad button').forEach(b => {
  const a = b.dataset.a;
  const stop = () => { if (a === 'left' || a === 'right') release(a); if (a === 'down') soft = false; };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (a === 'left' || a === 'right') press(a);
    else if (a === 'down') soft = true;
    else act(a);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, stop));
});

// swipe on the board: sideways to move, swipe down to drop, tap to rotate
let sw = null;
canvas.addEventListener('pointerdown', e => { sw = {x:e.clientX, y:e.clientY, moved:false}; });
canvas.addEventListener('pointermove', e => {
  if (!sw || mode !== 'play' || !cur) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) > 26){ move(dx > 0 ? 1 : -1); sw.x = e.clientX; sw.moved = true; }
  else if (dy > 60 && Math.abs(dy) > Math.abs(dx)){ hardDrop(); sw = null; }
});
canvas.addEventListener('pointerup', () => { if (sw && !sw.moved && mode === 'play') act('rotate'); sw = null; });
canvas.addEventListener('pointercancel', () => sw = null);

showStart();
</script>
</body>
</html>
