<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stockroom Snake</title>
<script>
/* Theme bootstrap: follows the Toolbox palette + appearance (same localStorage keys), and stays in sync via the storage event */
(function () {
  function apply() {
    var p = 'autumn', t = 'light';
    try { p = localStorage.getItem('stockroom_palette') === 'default' ? 'default' : 'autumn'; t = localStorage.getItem('stockroom_theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
    var d = document.documentElement; d.setAttribute('data-palette', p); d.setAttribute('data-theme', t);
    if (/[?&]embed\b/.test(location.search)) d.classList.add('embed');
  }
  apply();
  window.addEventListener('storage', function (e) { if (e.key === 'stockroom_palette' || e.key === 'stockroom_theme') { apply(); if (window.__onTheme) window.__onTheme(); } });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{ --font:'Press Start 2P','Courier New',monospace; --red:#FF5A4D; }
  /* ---- Palette: Default (Pitt blue + green). The "screen" colours stay dark in light appearance, like a CRT. ---- */
  html[data-palette="default"]{
    --s-bg:var(--s-bg); --s-panel:#0B1736; --s-line:#1B2D5E; --s-text:#DCE6FA; --s-muted:#7F92B8; --s-overlay:var(--s-overlay);
    --s-accent:#00AD6E; --s-accent-hover:var(--accent-hover); --s-on-accent:var(--on-accent); --s-edge:#003594;
    --floor-a:#0A1740; --floor-b:var(--s-bg); --floor-grid:rgba(0,173,110,.07); --hl:rgba(0,173,110,.18); --flash:rgba(0,173,110,.7); --card-hover:var(--card-hover);
  }
  html[data-palette="default"][data-theme="dark"]{ --bg:#0a1628; --panel:#10213b; --line:#223657; --text:#e6ecf5; --muted:#93a3bd; --shadow:var(--shadow); --focus:#fff;
    --accent:#00AD6E; --accent-hover:var(--accent-hover); --on-accent:var(--on-accent); --edge:#003594; }
  html[data-palette="default"][data-theme="light"]{ --bg:#f4f5f7; --panel:#ffffff; --line:#c9cfdb; --text:#1a1d23; --muted:#5a6072; --shadow:rgba(0,32,91,.28); --focus:#1a1d23;
    --accent:#007a4d; --accent-hover:#006640; --on-accent:#ffffff; --edge:#003594; }
  /* ---- Palette: Autumn (umber, rust, gold) ---- */
  html[data-palette="autumn"]{
    --s-bg:#1a0e07; --s-panel:#241409; --s-line:#50361f; --s-text:#fbefdc; --s-muted:#cdb393; --s-overlay:rgba(18,9,4,.94);
    --s-accent:#FFB81C; --s-accent-hover:#ffd24d; --s-on-accent:#1d0e06; --s-edge:#9c3a0b;
    --floor-a:#2a160a; --floor-b:#241208; --floor-grid:rgba(255,184,28,.09); --hl:rgba(255,184,28,.22); --flash:rgba(255,184,28,.78); --card-hover:#b4501a;
  }
  html[data-palette="autumn"][data-theme="dark"]{ --bg:#150b06; --panel:#241409; --line:#50361f; --text:#fbefdc; --muted:#d0b697; --shadow:#0b0503; --focus:#fff;
    --accent:#FFB81C; --accent-hover:#ffd24d; --on-accent:#1d0e06; --edge:#9c3a0b; }
  html[data-palette="autumn"][data-theme="light"]{ --bg:#f5ede0; --panel:#fffaf1; --line:#d8c4a4; --text:#22140b; --muted:#5e4838; --shadow:rgba(59,29,12,.3); --focus:#22140b;
    --accent:#9c3a0b; --accent-hover:#7a2a08; --on-accent:#ffffff; --edge:#FFB81C; }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;justify-content:center;padding:14px 12px 24px}
  #app{width:min(100%,488px)}

  header{margin-bottom:12px}
  h1{margin:0;font-size:clamp(16px,4.6vw,24px);line-height:1.2;color:var(--accent);
     text-shadow:3px 3px 0 var(--edge);letter-spacing:1px;font-weight:400}
  header p{margin:8px 0 0;font-size:8px;color:var(--muted);line-height:1.6}

  #hud{display:flex;align-items:stretch;gap:10px;margin-bottom:10px}
  .box{background:var(--panel);border:3px solid var(--line);padding:8px 10px}
  #who{display:flex;align-items:center;gap:10px;flex:1.3;min-width:0}
  #portrait{width:48px;height:48px;image-rendering:pixelated;background:var(--s-bg);border:2px solid var(--line);flex:none}
  .lbl{font-size:7px;color:var(--muted);margin-bottom:6px}
  .val{font-size:13px;color:var(--text)}
  #who .val{font-size:11px}
  #who .sub{font-size:6px;line-height:1.5;color:var(--muted);margin-top:5px}
  .stat{flex:1}
  #snd{font-family:var(--font);font-size:7px;color:var(--text);background:var(--panel);
    border:3px solid var(--line);cursor:pointer;padding:0 8px}
  #snd:hover{border-color:var(--accent)}

  #stage{position:relative;border:4px solid var(--edge);box-shadow:6px 6px 0 var(--shadow);background:var(--s-bg)}
  #stage.shake{animation:shake .35s steps(2) 1}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}
    50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}
  canvas#game{display:block;width:100%;height:auto;aspect-ratio:1/1;image-rendering:pixelated;touch-action:none}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}

  #overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:14px;text-align:center;background:var(--s-overlay)}
  #overlay.hidden{display:none}
  #overlay h2{margin:0;font-size:clamp(12px,3.6vw,17px);font-weight:400;line-height:1.4;color:var(--text)}
  #overlay h2.bad{color:var(--red);font-size:clamp(16px,5vw,24px);text-shadow:3px 3px 0 #4a1410}
  #overlay p{margin:0;font-size:8px;line-height:1.8;color:var(--muted)}
  #overlay p b{color:var(--text);font-weight:400}

  .cards{display:flex;gap:8px;width:100%}
  .card{flex:1;min-width:0;font-family:var(--font);color:var(--text);cursor:pointer;
    background:var(--panel);border:4px solid var(--line);padding:8px 4px 10px;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .card canvas{width:100%;max-width:96px;aspect-ratio:1/1;image-rendering:pixelated;background:var(--s-bg)}
  .card .nm{font-size:12px}
  .card .ds{font-size:7px;line-height:1.6;color:var(--muted);min-height:30px}
  .card:hover{border-color:var(--card-hover)}
  .card.sel{border-color:var(--accent);box-shadow:4px 4px 0 var(--edge);transform:translate(-2px,-2px)}
  .card.sel .nm{color:var(--accent)}

  .btn{font-family:var(--font);font-size:11px;color:var(--on-accent);background:var(--accent);cursor:pointer;
    border:0;padding:12px 18px;box-shadow:4px 4px 0 var(--edge)}
  .btn:hover{background:var(--accent-hover)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
  .btn.alt{background:var(--panel);color:var(--text);border:3px solid var(--line);box-shadow:none;padding:10px 14px;font-size:9px}
  .btn.alt:hover{border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  #toast{height:22px;margin-top:14px;font-size:9px;color:var(--accent);text-align:center;
    opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}

  #dpad{display:none;margin:6px auto 0;width:186px;grid-template-columns:repeat(3,58px);
    grid-template-rows:repeat(3,58px);gap:6px}
  #dpad button{font-family:var(--font);font-size:18px;color:var(--text);background:var(--panel);
    border:3px solid var(--line);cursor:pointer}
  #dpad button:active{background:var(--edge);border-color:var(--accent)}
  @media (pointer:coarse){#dpad{display:grid}}

  .keys{margin-top:14px;font-size:7px;color:var(--muted);line-height:2;text-align:center}
  @media (prefers-reduced-motion:reduce){#stage.shake{animation:none}}

  /* Anything on the game screen (playfield + its overlays) keeps the dark "screen" colours in every theme */
  #stage{ --text:var(--s-text); --muted:var(--s-muted); --panel:var(--s-panel); --line:var(--s-line);
          --accent:var(--s-accent); --accent-hover:var(--s-accent-hover); --on-accent:var(--s-on-accent); --edge:var(--s-edge); --focus:#fff; }
  html{ background:var(--bg); }
  html.embed body{ min-height:0; padding-top:8px; padding-bottom:16px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>STOCKROOM SNAKE</h1>
    <p>Pick up every item on the shelf. Don't hit the walls. Don't hit yourself.</p>
  </header>

  <div id="hud">

</div>

<script>
/* ============ PIXEL ART (24x24 sprites, drawn with rects) ============ */
const INK = '#15151A', WH = '#F7F7F2', SK = '#F0B58A', SKs = '#D4936A', MOUTH = '#8A3B32';

function outline(c){
  const g = c.getContext('2d');
  const a = g.getImageData(0, 0, 24, 24).data;
  const op = (x, y) => x >= 0 && y >= 0 && x < 24 && y < 24 && a[(y * 24 + x) * 4 + 3] > 0;
  const pts = [];
  for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++)
    if (!op(x, y) && (op(x-1, y) || op(x+1, y) || op(x, y-1) || op(x, y+1))) pts.push([x, y]);
  g.fillStyle = '#050B1E';
  pts.forEach(([x, y]) => g.fillRect(x, y, 1, 1));
}
function mk(fn){
  const c = document.createElement('canvas'); c.width = c.height = 24;
  const g = c.getContext('2d');
  const R = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  fn(R);
  outline(c);
  return c;
}

    // cap
    R(BL, 8, 3, 8, 1); R(BL, 6, 4, 12, 3); R(BLd, 6, 6, 12, 1); R(BLd, 11, 3, 2, 1);
    R('#00205E', 4, 7, 16, 1); R('#001640', 5, 8, 14, 1);
    // face
    R(SK, 6, 9, 12, 5); R(SK, 5, 11, 1, 2); R(SK, 18, 11, 1, 2); R(SKs, 11, 11, 2, 3);
    // thick square glasses, eyes visible through the lenses
    R(F, 6, 9, 12, 1); R(F, 11, 10, 2, 1); R(F, 5, 10, 1, 1); R(F, 18, 10, 1, 1);
    [[6, 7, 14], [13, 14, 17]].forEach(([fx, ix, rx]) => {
      R(F, fx, 13, 5, 1); R(F, fx, 10, 1, 3); R(F, fx + 4, 10, 1, 3);
      R(TINT, ix, 10, 3, 3); R(WH, ix, 11, 3, 2); R(INK, ix + 1, 11, 1, 2);

    // beard
    R(BR, 6, 14, 12, 4); R(BR, 7, 18, 10, 1); R(BRd, 8, 14, 8, 1); R(MOUTH, 10, 16, 4, 1);
    // blue t-shirt
    R(SKs, 10, 19, 4, 1);
    R(TS, 6, 19, 4, 1); R(TS, 14, 19, 4, 1); R(TS, 4, 20, 16, 3);
    R(TSd, 4, 20, 2, 3); R(TSd, 18, 20, 2, 3); R(TSd, 10, 20, 4, 1);
  }},
  { id:'dan', name:'Dan', title:'Operations Manager', draw: R => {
    const B = '#E6C25E', Bd = '#C29A36', G = '#2E2A38', M = '#C58A1C', Md = '#8F5C10';
    const LB = '#A9D0F5', LBd = '#6FA3D6', W2 = '#EEF5FC';
    // neat blonde hair with a part
    R(B, 8, 3, 8, 1); R(B, 6, 4, 12, 3); R(Bd, 9, 3, 1, 3); R(Bd, 6, 6, 12, 1);

    R(F, 11, 10, 2, 1); R(F, 4, 10, 2, 1); R(F, 18, 10, 2, 1);
    [[6, 7], [13, 14]].forEach(([fx, ix]) => {
      R(F, fx, 9, 5, 1); R(F, fx, 13, 5, 1); R(F, fx, 10, 1, 3); R(F, fx + 4, 10, 1, 3);
      R(WH, ix, 10, 3, 3); R(INK, ix + 1, 11, 1, 2);

    R(PUl, 5, 21, 3, 1); R(PUl, 16, 21, 3, 1);

    const speck = (x, y) => {

    R('rgba(160,211,232,0.18)', 6, 4, 12, 7);
    R(GL, 4, 3, 16, 1); R(GL, 3, 2, 1, 1);
    R(GL, 5, 4, 1, 16); R(GL, 18, 4, 1, 16); R(GL, 5, 20, 14, 1);
    R('#2F8FEF', 6, 11, 12, 9); R('#7CC0FF', 6, 11, 12, 1); R('#1560B8', 6, 18, 12, 2);
    R('#E9F6FF', 6, 6, 3, 1); R('#E9F6FF', 6, 9, 2, 1); R('#E9F6FF', 6, 13, 3, 1); R('#E9F6FF', 6, 16, 2, 1);
    R('#BFE1FF', 16, 13, 1, 4); R('#DFF0FF', 13, 15, 1, 1); R('#DFF0FF', 11, 17, 1, 1);
  }},
  { name:'Erlenmeyer flask', draw: R => {
    const GL = '#9FD3E8';
    R(GL, 9, 2, 6, 1); R(GL, 9, 3, 1, 6); R(GL, 14, 3, 1, 6);
    for (let y = 9; y <= 20; y++){
      const half = 3 + Math.round((y - 9) * 0.6);
      const l = 12 - half, r = 11 + half;
      if (y >= 14) R(y === 14 ? '#7BE0B2' : (y >= 19 ? '#00724A' : '#00AD6E'), l + 1, y, r - l - 1, 1);
      R(GL, l, y); R(GL, r, y);
      if (y === 20) R(GL, l, y, r - l + 1, 1);
    }
    R('#BFF3DC', 12, 16, 1, 1); R('#BFF3DC', 9, 18, 1, 1); R('#BFF3DC', 15, 17, 1, 1);
  }},
  { name:'Pipette', draw: R => {
    R('#D9382F', 10, 2, 4, 1); R('#D9382F', 8, 3, 8, 4); R('#D9382F', 9, 7, 6, 1);
    R('#FF8A80', 9, 3, 1, 3); R('#A8231C', 14, 4, 1, 3);
    R('#5B6570', 8, 8, 8, 2); R('#8A94A0', 8, 8, 8, 1);
    R('#CFEFF7', 9, 10, 6, 8); R('#FFFFFF', 9, 10, 1, 7); R('#9FD3E8', 14, 10, 1, 8);
    R('#2F8FEF', 10, 13, 4, 5); R('#7CC0FF', 10, 13, 4, 1);
    R('#6C8AA0', 14, 11, 1, 1); R('#6C8AA0', 14, 13, 1, 1); R('#6C8AA0', 14, 15, 1, 1);
    R('#CFEFF7', 10, 18, 4, 2); R('#2F8FEF', 11, 18, 2, 2); R('#2F8FEF', 11, 20, 2, 1);
    R('#7CC0FF', 11, 22, 2, 1);
  }},
  { name:'Nitrile gloves', draw: R => {
    R('#0B3F94', 3, 7, 18, 14); R('#1C6FE0', 4, 8, 16, 12); R('#3A8CF5', 4, 8, 16, 2);
    R('#1558B8', 4, 19, 16, 1);
    R('#2A7BEB', 9, 3, 6, 5); R('#5AA0F8', 9, 3, 1, 5); R('#1C6FE0', 14, 4, 1, 4);
    R('#0A2A6E', 8, 8, 8, 1);
    R('#F6F8FC', 5, 12, 14, 7); R('#8A94A0', 6, 13, 6, 1); R('#8A94A0', 6, 15, 4, 1);
    R('#00AD6E', 13, 13, 5, 5); R(WH, 15, 14, 1, 3); R(WH, 14, 15, 3, 1);
  }}
];

CHARACTERS.forEach(ch => ch.img = mk(ch.draw));
ITEMS.forEach(it => it.img = mk(it.draw));

/* ============ SETUP ============ */
const N = 20, CELL = 24;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const overlay = document.getElementById('overlay');
const stage = document.getElementById('stage');
const toastEl = document.getElementById('toast');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const whoName = document.getElementById('whoName');
const whoTitle = document.getElementById('whoTitle');
const portrait = document.getElementById('portrait').getContext('2d');
portrait.imageSmoothingEnabled = false;

// Pre-rendered floor
const floor = document.createElement('canvas'); floor.width = floor.height = N * CELL;
const TH = {};
function readTheme(){
  const cs = getComputedStyle(document.documentElement), v = (n, d) => cs.getPropertyValue(n).trim() || d;
  TH.floorA = v('--floor-a', '#0A1740'); TH.floorB = v('--floor-b', '#091336'); TH.grid = v('--floor-grid', 'rgba(0,173,110,0.07)');
  TH.hl = v('--hl', 'rgba(0,173,110,0.18)'); TH.flash = v('--flash', 'rgba(0,173,110,.7)');
}
function paintFloor(){
  const f = floor.getContext('2d');
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    f.fillStyle = ((x + y) & 1) ? TH.floorA : TH.floorB;
    f.fillRect(x * CELL, y * CELL, CELL, CELL);
    f.fillStyle = TH.grid;
    f.fillRect(x * CELL, y * CELL, CELL, 1);
    f.fillRect(x * CELL, y * CELL, 1, CELL);
  }
}
readTheme(); paintFloor();
window.__onTheme = () => { readTheme(); paintFloor(); };

/* ============ SOUND ============ */
let audio = null, soundOn = true;
function tone(freq, dur, delay = 0, type = 'square', vol = 0.05){
  if (!soundOn) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
const sfx = {
  pick(){ tone(660, .07); tone(990, .1, .07); },
  die(){ tone(300, .15, 0, 'sawtooth'); tone(220, .15, .13, 'sawtooth'); tone(140, .35, .26, 'sawtooth'); },
  start(){ tone(440, .08); tone(660, .08, .08); tone(880, .12, .16); }
};
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', toggleSound);
function toggleSound(){
  soundOn = !soundOn;
  sndBtn.innerHTML = soundOn ? 'SND<br>ON' : 'SND<br>OFF';
}

/* ============ GAME STATE ============ */
let mode = 'select';           // select | play | pause | over
let charIdx = 1;
let best = 0, score = 0, eaten = 0;
let snake = [], types = [], dir = [1, 0], queue = [], food = null, lastFoodType = -1;
let acc = 0, lastTs = 0, prev = [];

function interval(){ return Math.max(105, 210 - eaten * 2); }

function pickChar(i){
  charIdx = (i + CHARACTERS.length) % CHARACTERS.length;
  const ch = CHARACTERS[charIdx];
  whoName.textContent = ch.name.toUpperCase();
  whoTitle.textContent = ch.title;
  portrait.clearRect(0, 0, 24, 24); portrait.drawImage(ch.img, 0, 0);
  document.querySelectorAll('.card').forEach((el, k) => el.classList.toggle('sel', k === charIdx));
}

function resetGame(){
  const cx = 10, cy = 10;
  snake = [{x:cx, y:cy}, {x:cx-1, y:cy}, {x:cx-2, y:cy}];
  types = [null, 0, 1];
  dir = [1, 0]; queue = [];
  score = 0; eaten = 0; acc = 0;
  scoreEl.textContent = 0;
  spawnFood();
  prev = snake.map(s => ({x:s.x, y:s.y}));
}

function spawnFood(){
  const taken = new Set(snake.map(s => s.x + ',' + s.y));
  const free = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!taken.has(x + ',' + y)) free.push([x, y]);
  if (!free.length){ food = null; return; }
  const [x, y] = free[Math.floor(Math.random() * free.length)];
  let t;
  do { t = Math.floor(Math.random() * ITEMS.length); } while (t === lastFoodType);
  lastFoodType = t;
  food = { x, y, t };
}

function startGame(){
  resetGame();
  mode = 'play';
  overlay.classList.add('hidden');
  sfx.start();
}

function die(){
  mode = 'over';
  sfx.die();
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  if (score > best){ best = score; bestEl.textContent = best; }
  const lines = ['Item is currently unavailable.', 'Estimated restock date unknown.',
    'Please allow 3-5 business days.', 'Substitutions are not permitted.',
    'Your order has been cancelled.'];
  setTimeout(() => {
    overlay.innerHTML = `
      <h2 class="bad">BACKORDERED</h2>
      <p>${lines[Math.floor(Math.random() * lines.length)]}</p>
      <p>Items shipped: <b>${eaten}</b><br>Best run: <b>${best / 10}</b></p>
      <div class="row">
        <button class="btn" id="again">TRY AGAIN</button>
        <button class="btn alt" id="change">CHANGE PICKER</button>
      </div>`;
    overlay.classList.remove('hidden');
    document.getElementById('again').onclick = startGame;
    document.getElementById('change').onclick = showSelect;
    document.getElementById('again').focus();
  }, 650);
}

function tick(){
  if (queue.length) dir = queue.shift();
  const head = snake[0];
  const before = snake.map(s => ({x:s.x, y:s.y}));
  const nx = head.x + dir[0], ny = head.y + dir[1];
  if (nx < 0 || ny < 0 || nx >= N || ny >= N) return die();
  const eat = food && nx === food.x && ny === food.y;
  const limit = eat ? snake.length : snake.length - 1;   // tail moves away unless growing
  for (let i = 0; i < limit; i++) if (snake[i].x === nx && snake[i].y === ny) return die();
  snake.unshift({x:nx, y:ny});
  prev = before;
  if (eat){
    types.push(food.t);
    score += 10; eaten++;
    scoreEl.textContent = score;
    if (score > best){ best = score; bestEl.textContent = best; }
    showToast('+10  ' + ITEMS[food.t].name);
    sfx.pick();
    spawnFood();
  } else {
    snake.pop();
  }
}

let toastTimer;
function showToast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1100);
}

/* ============ DRAW ============ */
function sprite(img, gx, gy, dy = 0){
  ctx.drawImage(img, gx * CELL, gy * CELL + dy);
}
function draw(ts){
  ctx.drawImage(floor, 0, 0);
  if (!snake.length) return;
  // food, with a two-step bob and a blinking glint
  if (food){
    const bob = (Math.floor(ts / 380) % 2) ? -2 : 0;
    ctx.fillStyle = TH.hl;
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    sprite(ITEMS[food.t].img, food.x, food.y, bob);
    if (Math.floor(ts / 250) % 3 === 0){
      ctx.fillStyle = '#fff';
      ctx.fillRect(food.x * CELL + CELL - 6, food.y * CELL + 2, 2, 2);
    }
  }
  // body (tail first), then head
  const t = mode === 'over' ? 1 : Math.min(1, acc / interval());
  const at = i => {
    const a = prev[i] || snake[i], b = snake[i];
    return [Math.round((a.x + (b.x - a.x) * t) * CELL), Math.round((a.y + (b.y - a.y) * t) * CELL)];
  };
  for (let i = snake.length - 1; i >= 0; i--){
    const [px, py] = at(i);
    ctx.drawImage(i ? ITEMS[types[i]].img : CHARACTERS[charIdx].img, px, py);
  }
}

/* ============ LOOP ============ */
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(100, ts - lastTs); lastTs = ts;
  if (mode === 'play'){
    acc += dt;
    const iv = interval();
    while (acc >= iv && mode === 'play'){ acc -= iv; tick(); }
  }
  draw(ts);
}
requestAnimationFrame(frame);

/* ============ SCREENS ============ */
function showSelect(){
  mode = 'select';
  snake = []; food = null;
  overlay.innerHTML = `
    <h2>CHOOSE YOUR PICKER</h2>
    <div class="cards">
      ${CHARACTERS.map((c, i) => `
        <button class="card" data-i="${i}" aria-label="${c.name}">
          <canvas width="24" height="24"></canvas>
          <span class="nm">${c.name}</span>
          <span class="ds">${c.title}</span>
        </button>`).join('')}
    </div>
    <button class="btn" id="go">START SHIFT</button>`;
  overlay.classList.remove('hidden');
  overlay.querySelectorAll('.card').forEach((el, i) => {
    const cx = el.querySelector('canvas').getContext('2d');
    cx.drawImage(CHARACTERS[i].img, 0, 0);
    el.onclick = () => pickChar(i);
  });
  document.getElementById('go').onclick = startGame;
  pickChar(charIdx);
}

function togglePause(){
  if (mode === 'play'){
    mode = 'pause';
    overlay.innerHTML = `<h2>ON BREAK</h2><p>Press P or tap to resume.</p>
      <button class="btn" id="resume">RESUME</button>`;
    overlay.classList.remove('hidden');
    document.getElementById('resume').onclick = togglePause;
  } else if (mode === 'pause'){
    mode = 'play';
    overlay.classList.add('hidden');
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') togglePause(); });

/* ============ INPUT ============ */
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
function steer(name){
  if (mode !== 'play') return;
  const d = DIRS[name];
  const ref = queue.length ? queue[queue.length - 1] : dir;
  if (d[0] === -ref[0] && d[1] === -ref[1]) return;   // no instant reversals
  if (d[0] === ref[0] && d[1] === ref[1]) return;
  if (queue.length < 2) queue.push(d);
}
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); try{ parent.postMessage({ type: 'toolbox-quicklaunch' }, location.origin); }catch(x){} return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if (k === 'm' || k === 'M'){ toggleSound(); return; }
  if (mode === 'select'){
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') pickChar(charIdx - 1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') pickChar(charIdx + 1);
    else if (k === '1' || k === '2' || k === '3' || k === '4') pickChar(+k - 1);
    else if (k === 'Enter' || k === ' ') startGame();
    return;
  }
  if (mode === 'over'){
    if (k === 'Enter' || k === ' ') startGame();
    return;
  }
  if (k === 'p' || k === 'P' || k === ' ' || k === 'Escape'){ togglePause(); return; }
  if (KEYMAP[k]) steer(KEYMAP[k]);
});

document.querySelectorAll('#dpad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); steer(b.dataset.d); });
});

// swipe on the playfield
let sw = null;
canvas.addEventListener('pointerdown', e => { sw = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  sw = {x:e.clientX, y:e.clientY};
});
['pointerup','pointercancel','pointerleave'].forEach(ev => canvas.addEventListener(ev, () => sw = null));

showSelect();
</script>
</body>
</html>
