<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSS Stockroom Toolbox</title>
    <link rel="icon" type="image/svg+xml" href="Pitt-Shield.svg">
    <link rel="stylesheet" href="https://use.typekit.net/myu6uxh.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        /* Palette + appearance, read before paint. Autumn is the default palette. */
        (function () {
            var pal = 'autumn', th = 'light';
            try { pal = localStorage.getItem('stockroom_palette') === 'default' ? 'default' : 'autumn'; th = localStorage.getItem('stockroom_theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
            window.PALETTE = pal;
            document.documentElement.setAttribute('data-palette', pal);
            document.documentElement.setAttribute('data-theme', th);
        })();
    </script>
    <style>
        :root {
            --royal: #003594; --gold: #FFB81C; --navy: #00205B; --sky: #DBEEFF;
            --gothic: 'alternate-gothic-no-3-d', 'Arial Narrow', sans-serif;
            --serif: 'Instrument Serif', Georgia, serif;
            --sans: 'Roboto', Arial, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--sans); color: #fff; overflow: hidden;
            background: linear-gradient(155deg, var(--navy) 0%, #00296f 45%, var(--royal) 100%);
        }
        /* Autumn: warm umber to rust, still dark enough for the gold logo to pop */
        [data-palette="autumn"] body { background: linear-gradient(155deg, #1d0c04 0%, #44190a 48%, #86320f 100%); }
        [data-palette="autumn"][data-theme="dark"] body { background: linear-gradient(155deg, #0b0502 0%, #240e05 50%, #4d1d09 100%); }
        [data-palette="autumn"] .vignette { background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(28,10,3,.74) 0%, rgba(28,10,3,.36) 55%, rgba(28,10,3,0) 100%); }
        [data-palette="autumn"] .blurb { color: rgba(255,238,214,.94); }
        [data-palette="autumn"] .foot { color: rgba(255,226,190,.7); }
        [data-palette="autumn"] .gate-row { background: rgba(22,9,3,.78); }
        [data-palette="autumn"] .gate-row:focus-within { background: rgba(22,9,3,.88); }
        [data-palette="autumn"] .err { color: #ffb08f; }

        /* Background: a canvas-drawn grid that is warped, stretched and pulsed (see script) */
        #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
        .vignette { position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0,32,91,.72) 0%, rgba(0,32,91,.35) 55%, rgba(0,32,91,0) 100%); }

        .stage { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
        .logo { width: min(380px, 80vw); height: auto; display: block; margin-bottom: 26px; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
        .blurb { max-width: 520px; font-size: 17px; line-height: 1.65; font-weight: 300; color: rgba(219,238,255,.92); margin-bottom: 34px; animation: rise .7s .08s cubic-bezier(.2,.7,.2,1) both; }
        .gate { width: min(360px, 100%); animation: rise .7s .16s cubic-bezier(.2,.7,.2,1) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .gate label { display: block; text-align: left; font-family: var(--gothic); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 7px; }
        .gate-row { display: flex; height: 50px; border-radius: 10px; overflow: hidden; border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); transition: border-color .15s, box-shadow .15s, background .15s; }
        .gate-row:focus-within { border-color: var(--gold); background: rgba(255,255,255,.15); box-shadow: 0 0 0 3px rgba(255,184,28,.2); }
        .gate-row input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #fff; font-size: 16px; padding: 0 16px; font-family: var(--sans); }
        .gate-row input::placeholder { color: rgba(255,255,255,.45); }
        .btn-gold {
            border: none; background: var(--gold); color: var(--navy); cursor: pointer; padding: 0 22px;
            font-family: var(--gothic); font-size: 17px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
            transition: background .15s, transform .08s;
        }
        .btn-gold:hover { background: #ffe939; }
        .btn-gold:active { transform: scale(.97); }
        .btn-open { width: 100%; height: 52px; border-radius: 10px; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .err { height: 20px; margin-top: 8px; font-size: 13px; color: #ffb3a5; text-align: left; }
        .shake { animation: shake .4s; }
        @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

        .foot { position: fixed; bottom: 18px; left: 0; right: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 12px; color: rgba(219,238,255,.6); }
        .foot img { height: 28px; width: auto; display: block; opacity: .9; }

        @media (max-height: 640px) { .foot { position: static; margin-top: 30px; } }
        @media (prefers-reduced-motion: reduce) { .logo, .blurb, .gate { animation: none !important; } }
    </style>
</head>
<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main class="stage">
        <img class="logo" src="DSSS-Logo_Gold-White.svg" alt="Dietrich School Scientific Stockroom">
        <p class="blurb">The Toolbox is the Stockroom's internal staff platform for inventory lookup, hazmat compliance paperwork, order processing, customer communications, and day-to-day reference guides.</p>

        <div class="gate" id="gate-locked" hidden>
            <form id="login-form" autocomplete="off">
                <label for="pw">Password</label>
                <div class="gate-row" id="gate-row">
                    <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
                    <button class="btn-gold" type="submit">Enter</button>
                </div>
                <div class="err" id="err" role="alert"></div>
            </form>
        </div>

        <div class="gate" id="gate-open" hidden>
            <a class="btn-gold btn-open" href="./">Open the Toolbox</a>
        </div>
    </main>

    <div class="foot">
        <img src="Pitt-Shield.svg" alt="">
        <span>University of Pittsburgh · Shared Research Support Services</span>
    </div>


    <script>
        /* Warped, flowing grid. Every grid point is displaced by two travelling swells,
           a ring that pulses outward from the centre (lit gold as it passes), and a slow
           horizontal/vertical stretch that breathes in opposite directions. */
        (function () {
            if (window.PALETTE !== 'default') return;
            var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
            var W, H, dpr, S, calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var SPEED = calm ? 0.45 : 1, AMP = calm ? 0.6 : 1;   // reduced-motion: slower and gentler, never frozen
            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth; H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                S = W < 600 ? 38 : 52;                      // grid spacing
            }
            resize(); window.addEventListener('resize', resize);

            /* Cursor wave: moving the cursor disturbs the grid like water. A long, soft swell rolls across the screen in the
               direction you move (it stays put in the "water" rather than riding along with the cursor), builds gradually
               with speed, and settles slowly once you stop. No sharp edges, and no gold on the wave itself. */
            var tx = null, ty = null, ptx = null, pty = null, fx = window.innerWidth / 2, fy = window.innerHeight / 2;
            var svx = 0, svy = 0, ux = 1, uy = 0, amp = 0, trav = 0;      // smoothed velocity, wave direction (unit), wave strength 0..1, distance travelled
            function aim(e) { var p = e.touches ? e.touches[0] : e; if (p) { tx = p.clientX; ty = p.clientY; } }
            window.addEventListener('pointermove', aim, { passive: true });
            window.addEventListener('touchmove', aim, { passive: true });
            window.addEventListener('touchstart', aim, { passive: true });
            document.addEventListener('pointerleave', function () { tx = ty = null; });
            window.addEventListener('blur', function () { tx = ty = null; });
            cv.__wave = function () { return { ux: ux, uy: uy, amp: amp }; };      // (inspection hook; harmless)

            function warp(x, y, t) {
                var cx = W / 2, cy = H / 2, dx = x - cx, dy = y - cy;
                var nx = x / W, ny = y / H;
                var a = Math.sin(nx * 5.2 + t * 0.55) + Math.cos(ny * 4.1 - t * 0.42);
                var b = Math.sin((nx + ny) * 6.3 - t * 0.78);
                // faint ambient pulse from the centre keeps the page alive when nothing is moving
                var dc = Math.hypot(dx, dy) || 1, reach = Math.max(W, H) * 0.62;
                var amb = Math.sin(dc * 0.017 - t * 1.5) * Math.exp(-dc / reach) * 0.5;
                var sx = 1 + 0.10 * AMP * Math.sin(t * 0.43), sy = 1 + 0.10 * AMP * Math.cos(t * 0.37);  // stretch
                var ox = (a * 16 + b * 10 + (dx / dc) * amb * 34) * AMP;
                var oy = (b * 16 + a * 8 + (dy / dc) * amb * 34) * AMP;
                // directional swell
                var lit = 0;
                if (amp > 0.002) {
                    var rx = x - fx, ry = y - fy, along = rx * ux + ry * uy, perp = -rx * uy + ry * ux;
                    var sa = along > 0 ? 560 : 860;                                   // broad, with a long smooth wake behind the cursor
                    var env = Math.exp(-(along * along) / (2 * sa * sa) - (perp * perp) / (2 * 480 * 480));
                    var ph = (along + trav) * 0.0155 - t * 3.0;                       // ~400px swell; crests roll along the direction of travel
                    var s1 = Math.sin(ph), c1 = Math.cos(ph), k = (calm ? 0.65 : 1) * amp * env;
                    var lo = s1 * 17 * k, tr = c1 * 11 * k;                           // gentle push along travel + soft sideways roll (slope < 0.3: no fold-over)
                    ox += ux * lo - uy * tr;
                    oy += uy * lo + ux * tr;
                    lit = Math.abs(s1) * k;
                }
                return { x: cx + dx * sx + ox, y: cy + dy * sy + oy, ring: amb, w: Math.abs(a + b) / 4, lit: lit };
            }

            function line(vertical, pos, t) {
                var steps = Math.ceil((vertical ? H : W) / 13) + 2, prev = null;
                for (var i = -1; i <= steps; i++) {
                    var u = i * 13;
                    var p = warp(vertical ? pos : u, vertical ? u : pos, t);
                    if (prev) {
                        var glow = Math.max(0, (p.ring + prev.ring) / 2 - 0.28) * 2.2;     // 0..~1 on the pulse crest
                        if (glow > 0.12) { ctx.strokeStyle = 'rgba(255,184,28,' + Math.min(0.75, glow * 0.7).toFixed(3) + ')'; ctx.lineWidth = 1.4; }
                        else { ctx.strokeStyle = 'rgba(219,238,255,' + (0.10 + p.w * 0.15 + (p.lit + prev.lit) * 0.07).toFixed(3) + ')'; ctx.lineWidth = 1; }
                        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
                    }
                    prev = p;
                }
            }
            /* Pixel flashes: random grid squares light up gold, then fade. Each square is drawn
               through the same warp as the lines, so it bends and stretches with the grid. */
            var flashes = [], lastMs = 0, PAD = function () { return 3 * S; };
            function spawn(now) {
                var cols = Math.ceil((W + 2 * PAD()) / S), rows = Math.ceil((H + 2 * PAD()) / S);
                var ci = Math.floor(Math.random() * cols), cj = Math.floor(Math.random() * rows);
                var peak = 0.40 + Math.random() * 0.40, dur = 1.3 + Math.random() * 1.6;
                flashes.push({ ci: ci, cj: cj, t0: now, dur: dur, peak: peak });
                if (Math.random() < 0.18) {                       // occasionally a neighbour lights up with it
                    var d = Math.random() < 0.5 ? [1, 0] : [0, 1];
                    flashes.push({ ci: ci + d[0], cj: cj + d[1], t0: now + 0.12, dur: dur * 0.9, peak: peak * 0.8 });
                }
            }
            function drawFlashes(now, t) {
                var pad = PAD();
                for (var k = flashes.length - 1; k >= 0; k--) {
                    var f = flashes[k], p = (now - f.t0) / f.dur;
                    if (p >= 1) { flashes.splice(k, 1); continue; }
                    if (p < 0) continue;
                    var e = p < 0.1 ? p / 0.1 : Math.pow(1 - (p - 0.1) / 0.9, 1.4);    // fast rise, slow fade
                    var a = f.peak * e;
                    var x0 = -pad + f.ci * S, y0 = -pad + f.cj * S, h = S / 2;
                    var pts = [[0,0],[h,0],[S,0],[S,h],[S,S],[h,S],[0,S],[0,h]].map(function (o) { return warp(x0 + o[0], y0 + o[1], t); });
                    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
                    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.closePath();
                    ctx.globalCompositeOperation = 'lighter';           // additive: gold glows instead of turning grey
                    ctx.fillStyle = 'rgba(255,170,10,' + a.toFixed(3) + ')'; ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = 'rgba(255,214,102,' + Math.min(0.85, a * 1.8).toFixed(3) + ')'; ctx.lineWidth = 1.2; ctx.stroke();
                }
            }
            function frame(ms) {
                var t = ms / 1000 * SPEED * 1.35, now = ms / 1000, dt = Math.min(0.1, now - lastMs); lastMs = now;
                var gx = tx === null ? W / 2 : tx, gy = ty === null ? H / 2 : ty, k = 1 - Math.pow(0.002, dt);   // frame-rate independent easing
                fx += (gx - fx) * k; fy += (gy - fy) * k;
                // cursor velocity -> wave direction and strength
                if (tx !== null) {
                    if (ptx !== null && dt > 0) { svx += ((tx - ptx) / dt - svx) * 0.2; svy += ((ty - pty) / dt - svy) * 0.2; }
                    ptx = tx; pty = ty;
                } else { svx *= 0.9; svy *= 0.9; ptx = pty = null; }
                var sp = Math.hypot(svx, svy);
                if (sp > 80) { ux += (svx / sp - ux) * 0.06; uy += (svy / sp - uy) * 0.06; var um = Math.hypot(ux, uy) || 1; ux /= um; uy /= um; }
                trav += sp * Math.min(dt, 0.05) * (tx !== null ? 1 : 0);              // keeps crests anchored in the "water" while the cursor moves
                var target = Math.min(1, sp / 800);
                amp += (target - amp) * (target > amp ? 0.06 : 0.012);               // rises gently, settles slowly
                ctx.clearRect(0, 0, W, H);
                // ~8 new flashes per second (fewer for reduced-motion), capped
                var rate = (calm ? 4 : 8) * dt;
                if (flashes.length < 45) { while (rate > 0) { if (Math.random() < Math.min(1, rate)) spawn(now); rate -= 1; } }
                drawFlashes(now, t);
                var pad = 3 * S;
                for (var x = -pad; x <= W + pad; x += S) line(true, x, t);
                for (var y = -pad; y <= H + pad; y += S) line(false, y, t);
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();
    </script>

    <script>
        /* Autumn: leaves fall and tumble. Cursor (or finger) movement pushes and spins nearby leaves,
           and a click or tap sends out a burst. Each leaf is a pre-rendered, shaded sprite (outline, veins,
           stem, colour gradient, mottling, darkened margin) so drawing 90 of them stays cheap. */
        (function () {
            if (window.PALETTE !== 'autumn') return;
            var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
            var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var FALL = calm ? 0.55 : 1, PUSH = calm ? 0.6 : 1;      // reduced-motion: slower fall, softer push (never frozen)
            var W, H, dpr, leaves = [];
            var rnd = function (a, b) { return a + Math.random() * (b - a); };
            var saw = function (t) { return t - Math.floor(t); };

            /* ══ Leaf outlines (unit space: x about -1..1, tip up at y=-1, stem joins at the bottom) ══ */
            // Generic blade: width profile w(s) from base (s=0) to tip (s=1), optional teeth and asymmetry.
            function blade(o) {
                var N = 120, right = [], left = [], y0 = o.base || 0.9, len = o.len || 1.9;
                for (var i = 0; i <= N; i++) {
                    var s = i / N, env = Math.pow(Math.sin(Math.PI * s), 0.5);
                    var teeth = o.teeth ? env * (o.teeth.amp * saw(s * o.teeth.n) + (o.teeth.amp2 || 0) * saw(s * o.teeth.n * 3 + 0.3)) : 0;
                    var w = o.w(s) * (1 + teeth);
                    var y = y0 - s * len;
                    right.push([w * (o.r || 1), y]);
                    left.push([-w * (o.l || 1), y + (o.lShift || 0) * (1 - s)]);
                }
                return right.concat(left.reverse());
            }
            var ovate = function (peak, skew, pw) { return function (s) { return peak * Math.pow(Math.sin(Math.PI * Math.pow(s, skew)), pw); }; };

            // Maple: palmate, built in polar coordinates around the vein hub; sawtooth teeth along each lobe.
            function maple(lobes, sinus) {
                var pts = [], cy = -0.06, N = 420;
                for (var i = 0; i < N; i++) {
                    var th = -180 + i * 360 / N, r = sinus;
                    lobes.forEach(function (lb) {
                        var d = Math.abs(((th - lb.a + 540) % 360) - 180);                 // angular distance to lobe axis
                        if (d < lb.w) { var prof = sinus + (lb.L - sinus) * Math.pow(1 - d / lb.w, lb.p || 0.85); if (prof > r) r = prof; }
                    });
                    if (r > sinus + 0.06) r *= 1 + 0.085 * (saw(th / 7) - 0.5);           // teeth
                    var rad = th * Math.PI / 180;
                    pts.push([Math.sin(rad) * r, cy - Math.cos(rad) * r]);
                }
                return pts;
            }
            var SUGAR = [{ a: 0, L: 1.0, w: 36 }, { a: 55, L: .95, w: 33 }, { a: -55, L: .95, w: 33 }, { a: 117, L: .74, w: 30 }, { a: -117, L: .74, w: 30 }, { a: 180, L: .62, w: 48, p: 1.5 }];
            var RED   = [{ a: 0, L: 1.0, w: 40 }, { a: 60, L: .88, w: 36 }, { a: -60, L: .88, w: 36 }, { a: 180, L: .64, w: 70, p: 1.4 }];
            // Ginkgo: a fan with a shallow notch and wavy outer margin.
            function ginkgo() {
                var pts = [[0, 0.88]];
                for (var d = -44; d <= 44; d += 1) {
                    var ph = d * Math.PI / 180, notch = 0.20 * Math.exp(-Math.pow(d / 7, 2)), r = 1.46 + 0.035 * Math.sin(d * 0.9) - notch;
                    pts.push([r * Math.sin(ph), 0.88 - r * Math.cos(ph)]);
                }
                return pts;
            }
            // Oak: rounded lobes separated by sinuses.
            function oak() {
                return blade({ w: function (s) { var env = Math.pow(Math.sin(Math.PI * Math.pow(s, 1.3)), 0.75); return env * (0.34 + 0.44 * Math.pow(Math.abs(Math.sin(s * Math.PI * 3.6 + 0.5)), 0.6)); }, len: 1.95, base: 0.92 });
            }

            /* ── Vein layouts ── */
            function veinsBlade(vc, o) {
                var step = o.vstep || 0.12;                                   // midrib + curved secondary veins
                var y0 = o.base || 0.9, len = o.len || 1.9;
                vc.moveTo(0, y0); vc.quadraticCurveTo(0.02, y0 - len * 0.5, 0, y0 - len * 0.97);
                for (var s = 0.1; s < 0.86; s += step) for (var side = -1; side <= 1; side += 2) {
                    var s2 = Math.min(0.98, s + 0.17), ex = o.w(s2) * 0.86 * side * (side < 0 ? (o.l || 1) : (o.r || 1));
                    vc.moveTo(0, y0 - s * len); vc.quadraticCurveTo(ex * 0.35, y0 - (s + 0.05) * len, ex, y0 - s2 * len);
                }
            }
            function veinsMaple(vc, angles) {
                (angles || [0, 55, -55, 117, -117]).forEach(function (a) {
                    var r = a === 0 ? 0.95 : (Math.abs(a) < 90 ? 0.88 : 0.66), rad = a * Math.PI / 180;
                    vc.moveTo(0, 0.55); vc.lineTo(0, -0.06); vc.moveTo(0, -0.06); vc.lineTo(Math.sin(rad) * r, -0.06 - Math.cos(rad) * r);
                    [.45, .7].forEach(function (f) {                       // little side veins on each main vein
                        var bx = Math.sin(rad) * r * f, by = -0.06 - Math.cos(rad) * r * f;
                        [-1, 1].forEach(function (sd) { var a2 = rad + sd * 0.55; vc.moveTo(bx, by); vc.lineTo(bx + Math.sin(a2) * r * 0.2, by - Math.cos(a2) * r * 0.2); });
                    });
                });
            }
            function veinsGinkgo(vc) { for (var d = -42; d <= 42; d += 7) { var ph = d * Math.PI / 180; vc.moveTo(0, 0.88); vc.lineTo(1.3 * Math.sin(ph), 0.88 - 1.3 * Math.cos(ph)); } }

            var KINDS = [
                { name: 'maple',  pts: maple(SUGAR, 0.5), veins: function (vc) { veinsMaple(vc); }, stem: [0, 0.56, 0.02, 1.18], k: 1.18 },
                { name: 'maple2', pts: maple(RED, 0.5),   veins: function (vc) { veinsMaple(vc, [0, 60, -60]); }, stem: [0, 0.58, -0.03, 1.18], k: 1.1 },
                { name: 'oak',    pts: oak(),    veins: function (vc) { veinsBlade(vc, { w: function (s) { return 0.62 * Math.sin(Math.PI * Math.pow(s, 1.3)); }, base: 0.92, len: 1.95, vstep: 0.16 }); }, stem: [0, 0.92, 0.02, 1.12], k: 0.95 },
                { name: 'birch',  pts: blade({ w: ovate(0.74, 0.74, 0.9), teeth: { n: 15, amp: 0.07, amp2: 0.03 } }), veins: function (vc) { veinsBlade(vc, { w: ovate(0.74, 0.74, 0.9), vstep: 0.12 }); }, stem: [0, 0.9, 0.03, 1.12], k: 0.95 },
                { name: 'elm',    pts: blade({ w: ovate(0.60, 0.85, 0.95), teeth: { n: 17, amp: 0.085, amp2: 0.035 }, l: 0.78, lShift: 0.12 }), veins: function (vc) { veinsBlade(vc, { w: ovate(0.60, 0.85, 0.95), l: 0.78, vstep: 0.12 }); }, stem: [0, 0.9, -0.02, 1.1], k: 1.0 },
                { name: 'aspen',  pts: blade({ w: ovate(0.84, 0.95, 0.6), teeth: { n: 13, amp: 0.025 }, len: 1.8, base: 0.82 }), veins: function (vc) { veinsBlade(vc, { w: ovate(0.84, 0.95, 0.6), len: 1.8, base: 0.82, vstep: 0.13 }); }, stem: [0, 0.82, 0.04, 1.15], k: 0.9 },
                { name: 'ginkgo', pts: ginkgo(), veins: veinsGinkgo, stem: [0, 0.88, 0.0, 1.2], k: 0.85 },
                { name: 'willow', pts: blade({ w: ovate(0.28, 0.9, 0.8), teeth: { n: 24, amp: 0.025 }, len: 2.0, base: 0.95 }), veins: function (vc) { veinsBlade(vc, { w: ovate(0.28, 0.9, 0.8), len: 2.0, base: 0.95, vstep: 0.11 }); }, stem: [0, 0.95, 0.02, 1.1], k: 0.9, weight: 0.5 },

            /* Colours run base -> middle -> tip; a few keep a green base for leaves caught mid-turn. */
            var PALETTE = [

                ['#8a2a0c', '#d0501a', '#f58a2d'],   // red-orange
                ['#9a5a0a', '#e08e14', '#ffc233'],   // amber
                ['#a68214', '#d9b52a', '#f6e060'],   // yellow
                ['#4e1f0e', '#8a4116', '#c58231'],   // russet
                ['#3f5210', '#7c8c20', '#d2b83a'],   // olive turning gold
                ['#44100f', '#7a1a24', '#b04438'],   // burgundy

                    var rg = g.createRadialGradient(x, y, 0, x, y, r);
                    rg.addColorStop(0, lite ? 'rgba(255,214,120,0.30)' : 'rgba(60,14,6,0.26)'); rg.addColorStop(1, 'rgba(0,0,0,0)');

            function make(spreadY) {
                var z = rnd(.85, 1.25), size = rnd(20, 36) * z * (W < 700 ? 0.72 : 1), ki = weights[Math.floor(Math.random() * weights.length)];
                return {
                    kind: ki, col: Math.floor(Math.random() * PALETTE.length), k: KINDS[ki].k,
                    z: z, size: size, x: rnd(0, W), y: spreadY ? rnd(-40, H) : -size * 1.6,
                    vx: 0, vy: 0, baseVy: rnd(34, 78) * z, amp: rnd(14, 38), freq: rnd(.5, 1.3), ph: rnd(0, 6.28),
                    rot: rnd(-3.14, 3.14), w: 0, flip: rnd(0, 6.28), flipV: rnd(.7, 2.2), boost: 0, spin: Math.random() < .5 ? -1 : 1
                };
            }
            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth; H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                var phone = W < 700, n = Math.max(phone ? 26 : 45, Math.min(115, Math.round(W * H / (phone ? 9500 : 11500))));
                while (leaves.length < n) leaves.push(make(true));

                leaves.sort(function (a, b) { return a.z - b.z; });        // far leaves are painted first
            }
            resize(); window.addEventListener('resize', resize);
            cv.__leaves = leaves;

            /* ── Pointer ── */
            var mx = null, my = null, pmx = null, pmy = null, cvx = 0, cvy = 0, bursts = [];
            function aim(e) { var p = e.touches ? e.touches[0] : e; if (p) { mx = p.clientX; my = p.clientY; } }
            window.addEventListener('pointermove', aim, { passive: true });
            window.addEventListener('touchmove', aim, { passive: true });
            window.addEventListener('touchstart', aim, { passive: true });

            window.addEventListener('blur', function () { mx = my = pmx = pmy = null; });
            window.addEventListener('pointerdown', function (e) { if (e.target.closest && e.target.closest('input,button,a')) return; bursts.push({ x: e.clientX, y: e.clientY }); });

            var last = 0;
            function frame(ms) {

                if (mx !== null) {
                    if (pmx !== null) { cvx = cvx * 0.75 + ((mx - pmx) / dt) * 0.25; cvy = cvy * 0.75 + ((my - pmy) / dt) * 0.25; }

                ctx.clearRect(0, 0, W, H);
                for (var i = 0; i < leaves.length; i++) {

                    var tvx = Math.sin(t * L.freq + L.ph) * L.amp * FALL, tvy = L.baseVy * FALL;

            }

        })();
    </script>
    <script>
        (function () {
            var AUTH_KEY = 'stockroom_auth', CORRECT = 'enzyme';
            try { if (/\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/\.html$/, '')); } catch (e) {}
            var authed = false;
            try { authed = localStorage.getItem(AUTH_KEY) === '1'; } catch (e) {}

            // Already signed in: show the landing page with a button instead of the password field.
            // (No auto-redirect — this page may carry more content later.)
            document.getElementById(authed ? 'gate-open' : 'gate-locked').hidden = false;
            if (authed) return;

            var form = document.getElementById('login-form');
            var input = document.getElementById('pw');
            var row = document.getElementById('gate-row');
            var err = document.getElementById('err');

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (input.value.trim().toLowerCase() === CORRECT) {
                    try { localStorage.setItem(AUTH_KEY, '1'); } catch (x) {}
                    window.location.href = './';
                } else {
                    err.textContent = 'That password is not correct.';
                    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
                    input.select();
                }
            });
            input.addEventListener('input', function () { err.textContent = ''; });
        })();
    </script>
