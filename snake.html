<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockroom Snake — DSS Stockroom Toolbox</title>
    <link rel="icon" type="image/svg+xml" href="Pitt-Shield.svg">
    <script>
        /* Auth guard + theme, run before first paint */
        (function () {
            try {
                if (localStorage.getItem('stockroom_auth') !== '1') { location.replace('landing'); }
                document.documentElement.setAttribute('data-theme', localStorage.getItem('stockroom_theme') === 'dark' ? 'dark' : 'light');
                document.documentElement.setAttribute('data-palette', localStorage.getItem('stockroom_palette') === 'default' ? 'default' : 'autumn');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="https://use.typekit.net/myu6uxh.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="shared.js"></script>
    <script type="text/babel">


    /* A Breakroom game: the original game page runs in a same-origin frame (its own CSS / IDs / key handling stay isolated),
       themed to match the Toolbox. On desktop the frame fills the whole space below the header and the game scales itself to
       fit it; on narrow screens the frame is as tall as the game and the page scrolls as normal. */
    const FIT_MIN_WIDTH = 720;      // must match the threshold inside the game files
    const GameFrame = React.memo(function GameFrame({ src, title }) {
        const ref = useRef(null), wrapRef = useRef(null);
        const [h, setH] = useState(640);
        const [missing, setMissing] = useState(false);
        useEffect(() => {
            const f = ref.current, wrap = wrapRef.current; let ro = null, ro2 = null;
            const place = () => {
                try {
                    if (f.clientWidth >= FIT_MIN_WIDTH) {                   // desktop: fill the viewport below the header
                        const top = f.getBoundingClientRect().top;
                        setH(Math.max(420, Math.floor(window.innerHeight - top - 52)));      // status bar + main padding + wrapper padding
                    } else {                                                // narrow: as tall as the game
                        const d = f.contentDocument, app = d && d.getElementById('app');
                        if (app) setH(Math.ceil(app.getBoundingClientRect().height) + 28);
                    }
                } catch(e) {}
            };
            const onLoad = () => {
                try { if (!f.contentDocument.getElementById('app')) { setMissing(true); return; } } catch(e) {}
                place();
                try { ro = new ResizeObserver(place); ro.observe(f.contentDocument.getElementById('app')); f.contentWindow.focus(); } catch(e) {}
            };
            f.addEventListener('load', onLoad);
            window.addEventListener('resize', place);
            try { ro2 = new ResizeObserver(place); ro2.observe(wrap); } catch(e) {}      // sidebar collapse changes the frame width
            if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.getElementById('app')) onLoad();
            return () => { f.removeEventListener('load', onLoad); window.removeEventListener('resize', place); if (ro) ro.disconnect(); if (ro2) ro2.disconnect(); };
        }, []);
        return (
            <div className="bk-wrap" ref={wrapRef}>
                <iframe ref={ref} className="bk-frame" src={src} title={title} style={missing ? { display:'none' } : { height: h }} />
                {missing && <div className="bk-missing">The game file <strong>{src.split('?')[0]}</strong> was not found. Upload it to the site root next to <code>{window.location.pathname.replace(/^\//, '') || 'index'}.html</code>.</div>}
            </div>
        );
    });

    mountPage({ page: 'snake', title: null, desc: null, render: () => <GameFrame src="stockroom-snake.html?embed" title="Stockroom Snake" /> });

    </script>
</body>
</html>
